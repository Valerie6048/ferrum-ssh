name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev
      - name: Unit tests
        run: cargo test
      - name: SSH / SFTP / tunnel integration tests
        if: runner.os == 'Linux'
        run: |
          D=$RUNNER_TEMP/sshd && mkdir -p $D
          ssh-keygen -q -t ed25519 -N "" -f $D/host
          ssh-keygen -q -t ed25519 -N "" -f $D/client
          cp $D/client.pub $D/authorized_keys
          cat > $D/sshd_config <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $D/host
          PidFile $D/sshd.pid
          AuthorizedKeysFile $D/authorized_keys
          PasswordAuthentication no
          StrictModes no
          UsePAM no
          Subsystem sftp internal-sftp
          EOF
          sudo mkdir -p /run/sshd
          /usr/sbin/sshd -f $D/sshd_config
          FERRUM_IT_SSH="$(whoami)@127.0.0.1:2222" FERRUM_IT_KEY=$D/client cargo test it_ -- --ignored --test-threads=1
      - name: Release build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ferrum-${{ runner.os }}
          path: |
            target/release/ferrum
            target/release/ferrum.exe
